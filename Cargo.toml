[package]
name = "ayeos"
version = "0.2.2"
edition = "2021"
description = "ayeOS — ternary matrix inference daemon. CPU: kernel8 (hearth). GPU: MLX-QUANT (brain). Coord: vaked (capability graph)."

[[bin]]
name = "ayeosd"
path = "src/daemon.rs"

[[bin]]
name = "ayeos-matrix"
path = "src/matrix_cli.rs"

[[bin]]
name = "ayeos-golden-probe"
path = "src/bin/ayeos_golden_probe.rs"

[[bin]]
name = "ayeos-mobile"
path = "src/bin/ayeos-mobile.rs"

[[bin]]
name = "ayeos-sanctuary"
path = "src/bin/ayeos-sanctuary.rs"

[dependencies]
blake3 = { version = "1.8", features = ["pure"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
socket2 = "0.5"
