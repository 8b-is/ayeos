[package]
name = "ayeos"
version = "0.3.0"
edition = "2021"
description = "ayeOS — ternary matrix inference daemon. CPU: kernel8 (hearth). GPU: MLX-QUANT (brain). Coord: vaked (capability graph)."

[[bin]]
name = "ayeosd"
path = "src/daemon.rs"

[[bin]]
name = "ayeos-matrix"
path = "src/matrix_cli.rs"

[[bin]]
name = "ayeos-golden-probe"
path = "src/bin/ayeos_golden_probe.rs"

[[bin]]
name = "ayeos-mobile"
path = "src/bin/ayeos-mobile.rs"

[[bin]]
name = "ayeos-sanctuary"
path = "src/bin/ayeos-sanctuary.rs"

[[bin]]
name = "ayeos-capsule-sign"
path = "src/bin/ayeos-capsule-sign.rs"

[[bin]]
name = "ayeos-capsule-worker"
path = "src/bin/ayeos-capsule-worker.rs"

[[bin]]
name = "ayeos-inspector"
path = "src/bin/ayeos-inspector.rs"

[dependencies]
ayeos-manifest = { path = "crates/ayeos-manifest", features = ["std"] }
blake3 = { version = "1.8", features = ["pure"] }
ed25519-dalek = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
socket2 = "0.5"
